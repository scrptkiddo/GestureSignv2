name: Build English-only GestureSign

# English-only fork build.
# - build-classic:  the .NET Framework 4.8.1 solution (Daemon + ControlPanel + plugins)
# - build-winui:    the .NET 8 / WinUI 3 modern front-end (self-contained, win-x64)
# Both jobs are independent so one still produces an artifact if the other fails.

on:
  push:
    branches: [english-only]
  workflow_dispatch:

jobs:
  build-classic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: NuGet restore (packages.config)
        run: nuget restore GestureSign.sln

      - name: Locate an installed Windows SDK winmd
        shell: pwsh
        run: |
          $winmd = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\UnionMetadata\*\Windows.winmd" -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Directory.Name } -Descending |
            Select-Object -First 1
          if (-not $winmd) { Write-Error "No Windows.winmd found under UnionMetadata"; exit 1 }
          Write-Host "Using winmd: $($winmd.FullName)"
          "WINMD_HINT=$($winmd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build classic solution (Release, Any CPU)
        run: msbuild GestureSign.sln /p:Configuration=Release /p:Platform="Any CPU" /p:WindowsWinmdHintPath="$env:WINMD_HINT" /m /verbosity:minimal

      - name: Upload classic build
        uses: actions/upload-artifact@v4
        with:
          name: GestureSign-classic-en-Release
          path: bin/Release/
          if-no-files-found: error

  build-winui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # WinUI 3 PRI generation needs the AppxPackage MSBuild task that ships
      # with Visual Studio's MSBuild (missing from the plain dotnet SDK), so
      # restore + publish via msbuild rather than `dotnet publish`.
      - name: Restore WinUI
        run: msbuild GestureSign.WinUI/GestureSign.WinUI.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Publish WinUI front-end (win-x64, self-contained)
        run: msbuild GestureSign.WinUI/GestureSign.WinUI.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=publish\winui-x64\ /verbosity:minimal

      - name: Upload WinUI build
        uses: actions/upload-artifact@v4
        with:
          name: GestureSign-WinUI-en-win-x64
          path: GestureSign.WinUI/publish/winui-x64/
          if-no-files-found: error
